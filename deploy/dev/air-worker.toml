root = "."
tmp_dir = "/tmp/rsp-air-worker"

[build]
cmd = "go build -o /tmp/rsp-air-worker/worker ./backend/cmd/worker"
bin = "/tmp/rsp-air-worker/worker"
delay = 400
exclude_dir = [".git", "apps", "docs", "node_modules"]
include_dir = ["backend", "db"]
include_ext = ["go", "sql"]
kill_delay = "1s"
send_interrupt = true
stop_on_error = true

[log]
main_only = true
time = true

[misc]
clean_on_exit = true
