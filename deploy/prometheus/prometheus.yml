global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rsp-api
    metrics_path: /api/v2/metrics
    static_configs:
      - targets: ['api:8080']

  - job_name: rsp-auth
    metrics_path: /metrics
    static_configs:
      - targets: ['auth:3001']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
