limit_req_zone $binary_remote_addr zone=rsp_auth_sensitive:10m rate=5r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After "60" always;
        return 429 '{"type":"https://rsp.example/problems/rate_limited","title":"Too Many Requests","status":429,"detail":"Too many authentication requests.","instance":"$uri","code":"rate_limited","requestId":"$request_id","errors":[]}\n';
    }

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"live"}\n';
    }

    # Metrics stay on the container network. Deliberately shadow these paths
    # before the wider API and application proxy locations.
    location = /metrics { return 404; }
    location = /api/v2/metrics { return 404; }

    location ~ ^/api/auth/(sign-in|sign-up|forget-password|request-password-reset|reset-password|send-verification-email) {
        limit_req zone=rsp_auth_sensitive burst=4 nodelay;
        proxy_pass http://auth:3001;
        include /etc/nginx/includes/proxy-common.conf;
    }

    location /api/auth/ {
        proxy_pass http://auth:3001;
        include /etc/nginx/includes/proxy-common.conf;
    }

    location /api/v2/ {
        proxy_pass http://api:8080;
        include /etc/nginx/includes/proxy-common.conf;
    }

    location / {
        proxy_pass http://web:5173;
        include /etc/nginx/includes/proxy-common.conf;
    }
}
