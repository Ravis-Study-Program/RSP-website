limit_req_zone $binary_remote_addr zone=rsp_auth_sensitive:10m rate=5r/m;
limit_req_status 429;

# Compose publishes this server on host loopback only. Trust the Docker bridge
# peer (the host-local TLS terminator) to overwrite X-Real-IP, then use the
# resulting address for anonymous quotas and downstream auth limits.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Real-IP;
real_ip_recursive on;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After "60" always;
        return 429 '{"type":"https://rsp.example/problems/rate_limited","title":"Too Many Requests","status":429,"detail":"Too many authentication requests.","instance":"$uri","code":"rate_limited","requestId":"$request_id","errors":[]}\n';
    }

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"live"}\n';
    }

    location = /metrics { return 404; }
    location = /api/v2/metrics { return 404; }

    location ~ ^/api/auth/(sign-in|sign-up|forget-password|request-password-reset|reset-password|send-verification-email) {
        limit_req zone=rsp_auth_sensitive burst=4 nodelay;
        proxy_pass http://auth:3001;
        include /etc/nginx/includes/proxy-common.conf;
    }

    location /api/auth/ {
        proxy_pass http://auth:3001;
        include /etc/nginx/includes/proxy-common.conf;
    }

    location /api/v2/ {
        proxy_pass http://api:8080;
        include /etc/nginx/includes/proxy-common.conf;
    }

    location / {
        proxy_pass http://web:8080;
        include /etc/nginx/includes/proxy-common.conf;
    }
}
