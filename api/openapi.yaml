openapi: 3.0.3
info:
  title: RSP API
  version: 2.0.0
  description: Same-origin API for the Ravi's Study Program application.
servers:
  - url: /api/v2
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/Health' }
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Error' }
  /metrics:
    get:
      operationId: getMetrics
      security: []
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Internal Prometheus metrics
          content: { text/plain: { schema: { type: string } } }
  /me:
    get:
      operationId: getMe
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Current user and effective programme access,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Me' } },
              },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: updateMe
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/UpdateMe' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Updated current user,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Me' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/slug-suggestion:
    get:
      operationId: suggestMeSlug
      description: Returns a server-generated profile slug candidate that is unique at response time. PATCH /me remains authoritative and returns 409 if a concurrent claim wins.
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Unique profile slug candidate,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/SlugSuggestion' } },
              },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/practice-settings:
    get:
      operationId: getPracticeSettings
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Fixed programme time goals for every member,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/PracticeSettings' } },
              },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /users:
    get:
      operationId: listUsers
      parameters:
        [
          { $ref: '#/components/parameters/Limit' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Direction' },
          { $ref: '#/components/parameters/Sort' },
          { name: query, in: query, schema: { type: string, maxLength: 100 } },
          {
            name: seasonRole,
            in: query,
            schema: { $ref: '#/components/schemas/SeasonRole' },
          },
          {
            name: globalRole,
            in: query,
            schema: { $ref: '#/components/schemas/GlobalRole' },
          },
        ]
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: User page,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/UserPage' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /users/{id}/participation:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getUserParticipation
      parameters:
        - { name: seasonId, in: query, schema: { type: string, format: uuid } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Recorded programme participation, without administrative reasons
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageEnvelope' }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        {
                          type: array,
                          items: { $ref: '#/components/schemas/Participation' },
                        }
  /users/{id}/activity-summary:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getUserActivitySummary
      parameters:
        - { name: seasonId, in: query, schema: { type: string, format: uuid } }
        - {
            name: year,
            in: query,
            schema: { type: integer, minimum: 1900, maximum: 9999 },
          }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Activity totals for the selected member and period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivitySummary' }
  /seasons/{id}/activity-summary:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getSeasonActivitySummary
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Activity totals within this season
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivitySummary' }
  /users/{id}:
    parameters:
      [
        {
          name: id,
          in: path,
          required: true,
          description: Opaque user ID or unique profile slug,
          schema: { type: string },
        },
      ]
    get:
      operationId: getUser
      parameters:
        - { name: seasonId, in: query, schema: { type: string, format: uuid } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Member profile. Private fields are included only for the member or an authorised relationship.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        oneOf:
                          [
                            { $ref: '#/components/schemas/User' },
                            { $ref: '#/components/schemas/UserPrivate' },
                          ],
                      },
                  },
              },
          }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /users/{id}/practice-settings:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getUserPracticeSettings
      description: Returns private practice settings to the member, their assigned mentor, their season Coordinator, a Director, or a System Admin.
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Member practice settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/PracticeSettings' } },
              },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invitations/preview:
    post:
      operationId: previewInvitation
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/InvitationToken' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Invitation result,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Invitation' } },
              },
          }

  /invitations/accept:
    post:
      operationId: acceptInvitation
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/InvitationToken' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Invitation result,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Enrollment' } },
              },
          }

  /seasons/{id}/invitations:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: listInvitations
      parameters:
        [
          { $ref: '#/components/parameters/Limit' },
          { $ref: '#/components/parameters/Cursor' },
        ]
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Invitation history,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/InvitationPage' } },
              },
          }
    post:
      operationId: createInvitation
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/InvitationCreate' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '201':
          {
            description: Invitation,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Invitation' } },
              },
          }

  /seasons/{id}/invitations/{invitationId}/resend:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - {
          name: invitationId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: resendInvitation
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Invitation,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Invitation' } },
              },
          }

  /seasons/{id}/invitations/{invitationId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - {
          name: invitationId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: cancelInvitation
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Invitation,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Invitation' } },
              },
          }

  /seasons:
    get:
      operationId: listSeasons
      parameters:
        [
          { $ref: '#/components/parameters/Limit' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Direction' },
          { $ref: '#/components/parameters/Sort' },
          {
            name: status,
            in: query,
            schema: { type: string, enum: [open, closed] },
          },
        ]
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Season page,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/SeasonPage' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createSeason
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/SeasonMutation' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '201':
          {
            description: Created season,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Season' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getSeason
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Season,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Season' } },
              },
          }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteEmptySeason
      description: Deletes a season and its schedule only when it has no enrollment history, activity or pending invitations. Audit history is retained.
      responses:
        default: { $ref: '#/components/responses/Error' }
        '204': { description: Empty season deleted }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateSeason
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/SeasonUpdate' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Updated season,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Season' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/close:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: closeSeason
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/Reasoned' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Closed season,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Season' } },
              },
          }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/resources:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    patch:
      operationId: updateSeasonResources
      description: Updates only the resource link for an open season. The season Coordinator, a Director, or a System Admin may call this operation with recent MFA.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: '#/components/schemas/SeasonResourceUpdate' },
                },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Updated season,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Season' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/enrollment-candidates:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: listEnrollmentCandidates
      description: Lists verified active accounts that are not yet affiliated with this season. Only season administrators with recent MFA may call this operation; no private account fields are returned.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Direction' }
        - { $ref: '#/components/parameters/Sort' }
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Enrollment candidate page,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/EnrollmentCandidatePage' },
                  },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/reopen:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: reopenSeason
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/Reasoned' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Reopened season,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Season' } },
              },
          }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/weeks:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: listSeasonWeeks
      parameters:
        [
          { $ref: '#/components/parameters/Limit' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Direction' },
          { $ref: '#/components/parameters/Sort' },
        ]
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Week page,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/WeekPage' } },
              },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createSeasonWeek
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/WeekMutation' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '201':
          {
            description: Created week,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Week' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/weeks/{weekId}:
    parameters:
      [
        { $ref: '#/components/parameters/ID' },
        { name: weekId, in: path, required: true, schema: { type: string } },
      ]
    patch:
      operationId: updateSeasonWeek
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/WeekUpdate' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Updated week,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Week' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteSeasonWeek
      responses:
        default: { $ref: '#/components/responses/Error' }
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/members:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: listSeasonMembers
      parameters:
        [
          { $ref: '#/components/parameters/Limit' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Direction' },
          { $ref: '#/components/parameters/Sort' },
          {
            name: role,
            in: query,
            schema: { $ref: '#/components/schemas/SeasonRole' },
          },
          {
            name: state,
            in: query,
            schema: { $ref: '#/components/schemas/EnrollmentState' },
          },
        ]
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Enrollment page,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/EnrollmentPage' } },
              },
          }
        '403': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createSeasonMember
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/EnrollmentCreate' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '201':
          {
            description: Created enrollment,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Enrollment' } },
              },
          }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/members/{memberId}/promote:
    parameters:
      [
        { $ref: '#/components/parameters/ID' },
        { name: memberId, in: path, required: true, schema: { type: string } },
      ]
    post:
      operationId: promoteSeasonMember
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/Promotion' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Promoted enrollment,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Enrollment' } },
              },
          }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/members/{memberId}/correction:
    parameters:
