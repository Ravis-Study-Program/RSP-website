                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/MondayMentorReportList' },
                  },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/monday-updates/{updateId}/mark:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - {
          name: updateId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    put:
      operationId: putMondayUpdateMark
      description: Creates or replaces the authenticated mentor's own mark and comment on one update.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: '#/components/schemas/MondayUpdateMarkMutation' },
                },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '204': { description: Mark cleared }
        '200':
          {
            description: Saved mark,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/MondayUpdateMarkRecord' },
                  },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/monday-update-review:
    parameters:
      - { $ref: '#/components/parameters/ID' }
    get:
      operationId: listMondayUpdateReview
      description: One row per student enrolled in the season, with deduplicated solved counts and each update's content and marks.
      parameters:
        [
          {
            name: startDate,
            in: query,
            required: true,
            description: First calendar date of the selected range in Australia/Adelaide.,
            schema: { type: string, format: date },
          },
          {
            name: endDate,
            in: query,
            required: true,
            description: Last calendar date of the selected range in Australia/Adelaide.,
            schema: { type: string, format: date },
          },
          { $ref: '#/components/parameters/Limit' },
          { $ref: '#/components/parameters/Cursor' },
        ]
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Monday update review page,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/MondayUpdateReviewPage' },
                  },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /seasons/{id}/monday-update-activity:
    parameters:
      - { $ref: '#/components/parameters/ID' }
    get:
      operationId: getMondayUpdateActivity
      description: The authenticated active student's own LeetCode attempts and mock interviews inside the range, bounded exactly like an update with that range.
      parameters:
        [
          {
            name: startDate,
            in: query,
            required: true,
            description: First calendar date of the range in Australia/Adelaide.,
            schema: { type: string, format: date },
          },
          {
            name: endDate,
            in: query,
            required: true,
            description: Last calendar date of the range in Australia/Adelaide.,
            schema: { type: string, format: date },
          },
        ]
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Activity inside the range,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/MondayUpdateActivity' },
                  },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /canary/access:
    get:
      operationId: getCanaryAccess
      description: Canary deployments only; production returns 404. The caller's own global roles and canary season role.
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Caller access in the canary environment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanaryAccess' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      operationId: setCanaryAccess
      description: Canary deployments only; production returns 404. Replaces the caller's own global roles and canary season role. Privileged roles stay pending_mfa until TOTP is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanaryAccessUpdate' }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Updated caller access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanaryAccess' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string } }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, default: 25, minimum: 1, maximum: 100 },
      }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Direction:
      {
        name: direction,
        in: query,
        schema: { type: string, enum: [forward, backward], default: forward },
      }
    Sort: { name: sort, in: query, schema: { type: string } }
  responses:
    Health:
      description: Health status
      content:
        {
          application/json: { schema: { $ref: '#/components/schemas/Health' } },
        }
    Error:
      description: Request failed
      content:
        {
          application/json:
            { schema: { $ref: '#/components/schemas/ErrorResponse' } },
        }
    RateLimited:
      description: Rate limited
      headers:
        {
          Retry-After:
            { required: true, schema: { type: integer, minimum: 1 } },
        }
      content:
        {
          application/json:
            { schema: { $ref: '#/components/schemas/ErrorResponse' } },
        }
  schemas:
    AdminProfileUpdate:
      type: object
      required: [name, slug, discordId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, minLength: 3, maxLength: 50 }
        discordId: { type: string, nullable: true, maxLength: 100 }
    AdminProfile:
      allOf:
        - { $ref: '#/components/schemas/AdminProfileUpdate' }
        - type: object
          required: [id, email, avatarUrl]
          properties:
            avatarUrl: { type: string, nullable: true, readOnly: true }
            id: { type: string, format: uuid }
            email: { type: string, format: email }

    InvitationToken:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
    InvitationBatchCreate:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/InvitationBatchRow' }
    InvitationBatchRow:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string }
        email: { type: string }
        role: { type: string }
        mentor:
          type: string
          description: "A student's mentor, by email, username or full name."
        slug:
          type: string
          description: The person's username, if their account is new.
    InvitationBatchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/InvitationBatchResult' }
    InvitationBatchResult:
      type: object
      required: [row, outcome]
      properties:
        row: { type: integer }
        outcome:
          type: string
          description: 'For a dry run: invite, update or unchanged. Once sent: invited, updated or unchanged. Or failed.'
          enum: [invite, update, invited, updated, unchanged, failed]
        person:
          type: string
          description: 'Who the email matched: new (no account), account (an account not in the season) or member (already in the season).'
          enum: [new, account, member]
        invitation: { $ref: '#/components/schemas/Invitation' }
        role: { type: string }
        changes:
          type: array
          items: { $ref: '#/components/schemas/ImportChange' }
        skipped:
          type: array
          description: Fields the sheet differs on that this administrator may not change.
          items: { $ref: '#/components/schemas/ImportChange' }
        error: { type: string }
    ImportChange:
      type: object
      required: [field, from, to]
      properties:
        field: { type: string }
        from: { type: string }
        to: { type: string }
    InvitationInvitee:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
    InvitationCreate:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        role: { type: string, enum: [student, mentor, coordinator] }
        mentorUserId:
          type: string
          format: uuid
          description: A student's mentor; accepting the invitation assigns them.
    Invitation:
      type: object
      required:
        [
          id,
          seasonId,
          seasonName,
          seasonSlug,
          name,
          email,
          role,
          status,
          expiresAt,
          sentAt,
          mentorUserId,
          acceptedBy,
        ]
      properties:
        id: { type: string, format: uuid }
        seasonId: { type: string, format: uuid }
        seasonName: { type: string }
        seasonSlug: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [student, mentor, coordinator] }
        status: { type: string, enum: [pending, accepted, cancelled, expired] }
        expiresAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, nullable: true }
        mentorUserId:
          type: string
          format: uuid
          nullable: true
          description: The mentor a student was invited to.
        acceptedBy:
          type: string
          format: uuid
          nullable: true
          description: The account that accepted the invitation.
        profileSlug:
          type: string
          nullable: true
          description: The username the person gets on accepting with a new account.
    InvitationPage:
      type: object
      required: [items, pageInfo, totalCount]
      properties:
        items:
          { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
        totalCount: { type: integer }

    Health:
      {
        type: object,
        required: [status],
        properties: { status: { type: string, enum: [ok, ready] } },
      }
    SyncAccepted:
      {
        type: object,
        required: [status],
        properties: { status: { type: string, enum: [accepted] } },
      }
    GlobalRole: { type: string, enum: [director, system_admin] }
    SeasonRole: { type: string, enum: [student, mentor, coordinator] }
    EnrollmentState:
      { type: string, enum: [active, completed, kicked, withdrawn] }
    AssignmentState: { type: string, enum: [pending_mfa, active, revoked] }
    Difficulty: { type: string, enum: [easy, medium, hard] }
    AttemptOutcome:
      {
        description: 'Solved covers attempts solved independently or with no recorded outcome; Unsolved covers attempts solved with hints or not solved.',
        type: string,
        enum: [solved, unsolved],
      }
    AttemptMutationOutcome: { type: string, enum: [solved, unsolved] }
    PageInfo:
      type: object
      required: [nextCursor, previousCursor, hasMore]
      properties:
        {
          nextCursor: { type: string, nullable: true },
          previousCursor: { type: string, nullable: true },
          hasMore: { type: boolean },
        }
    User:
      type: object
      required:
        [
          id,
          slug,
          name,
          timezone,
          timezoneConfigured,
          globalRoles,
          seasonRoles,
          attemptCount,
          mockInterviewCount,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        timezone: { type: string }
        timezoneConfigured: { type: boolean }
        globalRoles:
          { type: array, items: { $ref: '#/components/schemas/GlobalRole' } }
        seasonRoles:
          {
            type: array,
            items: { $ref: '#/components/schemas/UserSeasonRole' },
          }
        attemptCount: { type: integer, format: int64, minimum: 0 }
        mockInterviewCount: { type: integer, format: int64, minimum: 0 }
    UserSeasonRole:
      type: object
      required: [seasonId, seasonSlug, role, state]
      properties:
        seasonId: { type: string }
        seasonSlug: { type: string }
        role: { $ref: '#/components/schemas/SeasonRole' }
        state: { $ref: '#/components/schemas/EnrollmentState' }
    UserPrivate:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [email, accountState]
          properties:
            {
              email: { type: string, format: email },
              accountState:
                {
                  type: string,
                  enum: [active, suspended, deletion_pending, deleted],
                },
            }
    UserPrivatePage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/UserPrivate' },
                    },
                },
            },
          ],
      }
    MeSeasonRole:
      type: object
      additionalProperties: false
      required: [seasonId, seasonSlug, role, state]
      properties:
        seasonId: { type: string }
        seasonSlug: { type: string }
        role: { $ref: '#/components/schemas/SeasonRole' }
        state: { $ref: '#/components/schemas/EnrollmentState' }
    Me:
      allOf:
        - $ref: '#/components/schemas/UserPrivate'
        - type: object
          required: [emailVerified, mfaVerified, seasonRoles, alumni]
          properties:
            emailVerified: { type: boolean }
            mfaVerified: { type: boolean }
            seasonRoles:
              {
                type: array,
                items: { $ref: '#/components/schemas/MeSeasonRole' },
              }
            alumni: { type: boolean }
    UpdateMe:
      type: object
      additionalProperties: false
      required: [name, timezone]
      properties:
        {
          name: { type: string, minLength: 1, maxLength: 100 },
          slug:
            { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,48}[a-z0-9])?$' },
          timezone: { type: string },
        }
    SlugSuggestion:
      type: object
      additionalProperties: false
      required: [slug]
      properties:
        {
          slug:
            { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,48}[a-z0-9])?$' },
        }
    PracticeSettings:
      type: object
      description: The program's practice time goals, in minutes. They apply to every member and are set by coordinators and administrators.
      required:
        [goalsEnabled, easyMinutes, mediumMinutes, hardMinutes, weeklyHours]
      properties:
        goalsEnabled: { type: boolean, enum: [true] }
        easyMinutes: { type: integer, minimum: 1, maximum: 180 }
        mediumMinutes: { type: integer, minimum: 1, maximum: 180 }
        hardMinutes: { type: integer, minimum: 1, maximum: 180 }
        weeklyHours:
          {
            type: integer,
            minimum: 1,
            maximum: 168,
            description: Hours a week the program expects of each student.,
          }
    StudentRequirements:
      type: object
      additionalProperties: false
      properties:
        easyMinutes: { type: integer, minimum: 1, maximum: 180, nullable: true }
        mediumMinutes:
          { type: integer, minimum: 1, maximum: 180, nullable: true }
        hardMinutes: { type: integer, minimum: 1, maximum: 180, nullable: true }
        weeklyHours: { type: integer, minimum: 1, maximum: 168, nullable: true }
    PracticeSettingsMutation:
      type: object
      additionalProperties: false
      required: [easyMinutes, mediumMinutes, hardMinutes, weeklyHours]
      properties:
        easyMinutes: { type: integer, minimum: 1, maximum: 180 }
        mediumMinutes: { type: integer, minimum: 1, maximum: 180 }
        hardMinutes: { type: integer, minimum: 1, maximum: 180 }
        weeklyHours: { type: integer, minimum: 1, maximum: 168 }
    AccountStateMutation:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties:
        {
          state: { type: string, enum: [active, suspended] },
          reason: { type: string, minLength: 1, maxLength: 500 },
        }
    GlobalRoleGrant:
      type: object
      additionalProperties: false
      required: [role, reason]
      properties:
        {
          role: { $ref: '#/components/schemas/GlobalRole' },
          reason: { type: string, minLength: 1, maxLength: 500 },
        }
    CanarySeasonRole:
      { type: string, enum: [student, mentor, coordinator, removed] }
    CanaryRoleState:
      type: object
      additionalProperties: false
      required: [role, state]
      properties:
        role: { type: string }
        state:
          description: Assignment state for active roles; enrollment state (kicked or withdrawn) when role is removed.
          type: string
    CanaryAccess:
      type: object
      additionalProperties: false
      required: [season, seasonRole, globalRoles, mfaConfigured]
      properties:
        season:
          type: object
          additionalProperties: false
          required: [id, slug, name]
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        seasonRole:
          allOf: [{ $ref: '#/components/schemas/CanaryRoleState' }]
          nullable: true
        globalRoles:
          type: array
          items: { $ref: '#/components/schemas/CanaryRoleState' }
        mfaConfigured: { type: boolean }
    CanaryAccessUpdate:
      type: object
      additionalProperties: false
      required: [globalRoles, seasonRole]
      properties:
        globalRoles:
          type: array
          items: { $ref: '#/components/schemas/GlobalRole' }
        seasonRole: { $ref: '#/components/schemas/CanarySeasonRole' }
    GlobalRoleAssignment:
      type: object
      additionalProperties: false
      required: [id, userId, role, state]
      properties:
        {
          id: { type: string },
          userId: { type: string },
          role: { $ref: '#/components/schemas/GlobalRole' },
          state: { $ref: '#/components/schemas/AssignmentState' },
        }
    GlobalRoleAssignmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        {
          items:
            {
              type: array,
              items: { $ref: '#/components/schemas/GlobalRoleAssignment' },
            },
        }
    UserPage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/User' },
                    },
                },
            },
          ],
      }
    EnrollmentCandidate:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
    EnrollmentCandidatePage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items:
                        { $ref: '#/components/schemas/EnrollmentCandidate' },
                    },
                },
            },
          ],
      }
    Season:
      type: object
      required:
        [
          id,
          slug,
          name,
          status,
          startAt,
          endAt,
          location,
          imageUrl,
          resourcesUrl,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [open, closed] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        location: { type: string }
        imageUrl: { type: string }
        resourcesUrl: { type: string }
    SeasonMutation:
      type: object
      additionalProperties: false
      required: [name, slug, startAt, endAt, location, imageUrl, resourcesUrl]
      properties:
        name: { type: string, minLength: 1 }
        slug:
          {
            type: string,
            minLength: 1,
            maxLength: 50,
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$',
          }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        location: { type: string }
        imageUrl: { type: string, format: uri }
        resourcesUrl: { type: string, format: uri }
    SeasonImport:
      type: object
      required: [name, slug, location, imageUrl, resourcesUrl, weeks]
      properties:
        name: { type: string, minLength: 1 }
        slug:
          {
            type: string,
            minLength: 1,
            maxLength: 50,
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$',
          }
        location: { type: string }
        imageUrl: { type: string }
        resourcesUrl: { type: string }
        weeks:
          type: array
          minItems: 1
          maxItems: 104
          items: { $ref: '#/components/schemas/SeasonImportWeek' }
    SeasonImportWeek:
      type: object
      required: [number, startAt, endAt, resourcesHtml]
      properties:
        number: { type: integer, minimum: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        resourcesHtml: { type: string }
    SeasonUpdate:
      allOf:
        - $ref: '#/components/schemas/SeasonMutation'
        - type: object
    SeasonResourceUpdate:
      type: object
      additionalProperties: false
      required: [resourcesUrl]
      properties: { resourcesUrl: { type: string, format: uri } }
    SeasonPage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/Season' },
                    },
                },
            },
          ],
      }
    Week:
      type: object
      required: [id, seasonId, number, startAt, endAt, resourcesHtml]
      properties:
        {
          id: { type: string },
          seasonId: { type: string },
          number: { type: integer, minimum: 1 },
          startAt: { type: string, format: date-time },
          endAt: { type: string, format: date-time },
          resourcesHtml: { type: string, maxLength: 50000 },
        }
    WeekResourcesUpdate:
      type: object
      additionalProperties: false
      required: [resourcesHtml]
      properties: { resourcesHtml: { type: string, maxLength: 50000 } }
    WeekMutation:
      type: object
      additionalProperties: false
      required: [number, startAt, endAt]
      properties:
        {
          number: { type: integer, minimum: 1 },
          startAt: { type: string, format: date-time },
          endAt: { type: string, format: date-time },
        }
    WeekUpdate:
      type: object
      additionalProperties: false
      required: [number, startAt, endAt]
      properties:
        {
          number: { type: integer, minimum: 1 },
          startAt: { type: string, format: date-time },
          endAt: { type: string, format: date-time },
        }
    WeekPage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/Week' },
                    },
                },
