        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/users/{id}/global-roles:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: grantAdminUserGlobalRole
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/GlobalRoleGrant' } },
            },
        }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '201':
          {
            description: Granted role. State is active only when the auth service confirms TOTP is configured; otherwise pending_mfa.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/GlobalRoleAssignment' },
                  },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      operationId: listAdminUserGlobalRoles
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Active and pending global role assignments,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/GlobalRoleAssignmentList' },
                  },
              },
          }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/users/{id}/global-roles/{role}:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - {
          name: role,
          in: path,
          required: true,
          schema: { $ref: '#/components/schemas/GlobalRole' },
        }
    delete:
      operationId: revokeAdminUserGlobalRole
      parameters:
        - {
            name: reason,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 500 },
          }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Revoked role assignment,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/GlobalRoleAssignment' },
                  },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string } }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, default: 25, minimum: 1, maximum: 100 },
      }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Direction:
      {
        name: direction,
        in: query,
        schema: { type: string, enum: [forward, backward], default: forward },
      }
    Sort: { name: sort, in: query, schema: { type: string } }
  responses:
    Health:
      description: Health status
      content:
        {
          application/json: { schema: { $ref: '#/components/schemas/Health' } },
        }
    Error:
      description: Request failed
      content:
        {
          application/json:
            { schema: { $ref: '#/components/schemas/ErrorResponse' } },
        }
    RateLimited:
      description: Rate limited
      headers:
        {
          Retry-After:
            { required: true, schema: { type: integer, minimum: 1 } },
        }
      content:
        {
          application/json:
            { schema: { $ref: '#/components/schemas/ErrorResponse' } },
        }
  schemas:
    AdminProfileUpdate:
      type: object
      required: [name, slug, avatarUrl, discordId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, minLength: 3, maxLength: 50 }
        avatarUrl: { type: string, nullable: true }
        discordId: { type: string, nullable: true, maxLength: 100 }
    AdminProfile:
      allOf:
        - { $ref: '#/components/schemas/AdminProfileUpdate' }
        - type: object
          required: [id, email]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }

    InvitationToken:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
    InvitationCreate:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        role: { type: string, enum: [student, mentor, coordinator] }
    Invitation:
      type: object
      required:
        [
          id,
          seasonId,
          seasonName,
          seasonSlug,
          name,
          email,
          role,
          status,
          expiresAt,
          sentAt,
        ]
      properties:
        id: { type: string, format: uuid }
        seasonId: { type: string, format: uuid }
        seasonName: { type: string }
        seasonSlug: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [student, mentor, coordinator] }
        status: { type: string, enum: [pending, accepted, cancelled, expired] }
        expiresAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, nullable: true }
    InvitationPage:
      type: object
      required: [items, pageInfo, totalCount]
      properties:
        items:
          { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
        totalCount: { type: integer }

    Health:
      {
        type: object,
        required: [status],
        properties: { status: { type: string, enum: [ok, ready] } },
      }
    SyncAccepted:
      {
        type: object,
        required: [status],
        properties: { status: { type: string, enum: [accepted] } },
      }
    GlobalRole: { type: string, enum: [director, system_admin] }
    SeasonRole: { type: string, enum: [student, mentor, coordinator] }
    EnrollmentState:
      { type: string, enum: [active, completed, kicked, withdrawn] }
    AssignmentState: { type: string, enum: [pending_mfa, active, revoked] }
    Difficulty: { type: string, enum: [easy, medium, hard] }
    AttemptOutcome:
      {
        type: string,
        enum: [independently_solved, solved_with_hints, not_solved, unknown],
      }
    AttemptMutationOutcome:
      {
        type: string,
        enum: [independently_solved, solved_with_hints, not_solved],
      }
    PageInfo:
      type: object
      required: [nextCursor, previousCursor, hasMore]
      properties:
        {
          nextCursor: { type: string, nullable: true },
          previousCursor: { type: string, nullable: true },
          hasMore: { type: boolean },
        }
    User:
      type: object
      required:
        [
          id,
          slug,
          name,
          timezone,
          timezoneConfigured,
          globalRoles,
          seasonRoles,
          attemptCount,
          mockInterviewCount,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        timezone: { type: string }
        timezoneConfigured: { type: boolean }
        globalRoles:
          { type: array, items: { $ref: '#/components/schemas/GlobalRole' } }
        seasonRoles:
          {
            type: array,
            items: { $ref: '#/components/schemas/UserSeasonRole' },
          }
        attemptCount: { type: integer, format: int64, minimum: 0 }
        mockInterviewCount: { type: integer, format: int64, minimum: 0 }
    UserSeasonRole:
      type: object
      required: [seasonId, seasonSlug, role, state]
      properties:
        seasonId: { type: string }
        seasonSlug: { type: string }
        role: { $ref: '#/components/schemas/SeasonRole' }
        state: { $ref: '#/components/schemas/EnrollmentState' }
    UserPrivate:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [email, accountState]
          properties:
            {
              email: { type: string, format: email },
              accountState:
                {
                  type: string,
                  enum: [active, suspended, deletion_pending, deleted],
                },
            }
    UserPrivatePage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/UserPrivate' },
                    },
                },
            },
          ],
      }
    MeSeasonRole:
      type: object
      additionalProperties: false
      required: [seasonId, seasonSlug, role, state]
      properties:
        seasonId: { type: string }
        seasonSlug: { type: string }
        role: { $ref: '#/components/schemas/SeasonRole' }
        state: { $ref: '#/components/schemas/EnrollmentState' }
    Me:
      allOf:
        - $ref: '#/components/schemas/UserPrivate'
        - type: object
          required: [emailVerified, mfaVerified, seasonRoles, alumni]
          properties:
            emailVerified: { type: boolean }
            mfaVerified: { type: boolean }
            seasonRoles:
              {
                type: array,
                items: { $ref: '#/components/schemas/MeSeasonRole' },
              }
            alumni: { type: boolean }
    UpdateMe:
      type: object
      additionalProperties: false
      required: [name, timezone]
      properties:
        {
          name: { type: string, minLength: 1, maxLength: 100 },
          slug:
            { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,48}[a-z0-9])?$' },
          avatarUrl: { type: string, format: uri, nullable: true },
          timezone: { type: string },
        }
    SlugSuggestion:
      type: object
      additionalProperties: false
      required: [slug]
      properties:
        {
          slug:
            { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,48}[a-z0-9])?$' },
        }
    PracticeSettings:
      type: object
      description: Fixed programme time goals. These apply automatically to every member and cannot be customised.
      required: [goalsEnabled, easyMinutes, mediumMinutes, hardMinutes]
      properties:
        goalsEnabled: { type: boolean, enum: [true] }
        easyMinutes: { type: integer, enum: [20] }
        mediumMinutes: { type: integer, enum: [35] }
        hardMinutes: { type: integer, enum: [50] }
    AccountStateMutation:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties:
        {
          state: { type: string, enum: [active, suspended] },
          reason: { type: string, minLength: 1, maxLength: 500 },
        }
    GlobalRoleGrant:
      type: object
      additionalProperties: false
      required: [role, reason]
      properties:
        {
          role: { $ref: '#/components/schemas/GlobalRole' },
          reason: { type: string, minLength: 1, maxLength: 500 },
        }
    GlobalRoleAssignment:
      type: object
      additionalProperties: false
      required: [id, userId, role, state]
      properties:
        {
          id: { type: string },
          userId: { type: string },
          role: { $ref: '#/components/schemas/GlobalRole' },
          state: { $ref: '#/components/schemas/AssignmentState' },
        }
    GlobalRoleAssignmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        {
          items:
            {
              type: array,
              items: { $ref: '#/components/schemas/GlobalRoleAssignment' },
            },
        }
    UserPage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/User' },
                    },
                },
            },
          ],
      }
    EnrollmentCandidate:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
    EnrollmentCandidatePage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items:
                        { $ref: '#/components/schemas/EnrollmentCandidate' },
                    },
                },
            },
          ],
      }
    Season:
      type: object
      required:
        [
          id,
          slug,
          name,
          status,
          startAt,
          endAt,
          location,
          imageUrl,
          resourcesUrl,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [open, closed] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        location: { type: string }
        imageUrl: { type: string }
        resourcesUrl: { type: string }
    SeasonMutation:
      type: object
      additionalProperties: false
      required: [name, slug, startAt, endAt, location, imageUrl, resourcesUrl]
      properties:
        name: { type: string, minLength: 1 }
        slug:
          {
            type: string,
            minLength: 1,
            maxLength: 50,
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$',
          }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        location: { type: string }
        imageUrl: { type: string, format: uri }
        resourcesUrl: { type: string, format: uri }
    SeasonUpdate:
      allOf:
        - $ref: '#/components/schemas/SeasonMutation'
        - type: object
    SeasonResourceUpdate:
      type: object
      additionalProperties: false
      required: [resourcesUrl]
      properties: { resourcesUrl: { type: string, format: uri } }
    SeasonPage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/Season' },
                    },
                },
            },
          ],
      }
    Week:
      type: object
      required: [id, seasonId, number, startAt, endAt, resourceUrl]
      properties:
        {
          id: { type: string },
          seasonId: { type: string },
          number: { type: integer, minimum: 1 },
          startAt: { type: string, format: date-time },
          endAt: { type: string, format: date-time },
          resourceUrl: { type: string },
        }
    WeekMutation:
      type: object
      additionalProperties: false
      required: [number, startAt, endAt]
      properties:
        {
          number: { type: integer, minimum: 1 },
          startAt: { type: string, format: date-time },
          endAt: { type: string, format: date-time },
          resourceUrl: { type: string, format: uri },
        }
    WeekUpdate:
      type: object
      additionalProperties: false
      required: [number, startAt, endAt]
      properties:
        {
          number: { type: integer, minimum: 1 },
          startAt: { type: string, format: date-time },
          endAt: { type: string, format: date-time },
          resourceUrl: { type: string, format: uri },
        }
    WeekPage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/Week' },
                    },
                },
            },
          ],
      }
    ParticipationPeriod:
      type: object
      required: [role, startedAt, endedAt]
      properties:
        role: { $ref: '#/components/schemas/SeasonRole' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
    Participation:
      allOf:
        - { $ref: '#/components/schemas/Enrollment' }
        - type: object
          required:
            [seasonName, seasonSlug, startAt, endAt, lastStudentLevel, periods]
          properties:
            seasonName: { type: string }
            seasonSlug: { type: string }
            startAt: { type: string, format: date-time }
            endAt: { type: string, format: date-time }
            lastStudentLevel:
              {
                type: string,
                enum:
                  [novice, beginner, intermediate, advanced, not_applicable],
              }
            periods:
              {
                type: array,
                items: { $ref: '#/components/schemas/ParticipationPeriod' },
              }
    ActivitySummary:
      type: object
      required:
        [
          attemptCount,
          mockInterviewCount,
          mocksReceived,
          mocksConducted,
          lastActivityAt,
        ]
      properties:
        attemptCount: { type: integer, minimum: 0 }
        mockInterviewCount: { type: integer, minimum: 0 }
        mocksReceived: { type: integer, minimum: 0 }
        mocksConducted: { type: integer, minimum: 0 }
        lastActivityAt: { type: string, format: date-time, nullable: true }
    SeasonMemberSummary:
      type: object
      required: [id, slug, name, avatarUrl, activity]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        activity: { $ref: '#/components/schemas/ActivitySummary' }
    Enrollment:
      type: object
      required:
        [id, seasonId, userId, role, studentLevel, state, assignmentState]
      properties:
        {
          id: { type: string },
          seasonId: { type: string },
          userId: { type: string },
          role: { $ref: '#/components/schemas/SeasonRole' },
          studentLevel:
            {
              type: string,
              enum: [novice, beginner, intermediate, advanced, not_applicable],
            },
          state: { $ref: '#/components/schemas/EnrollmentState' },
          assignmentState: { $ref: '#/components/schemas/AssignmentState' },
          member: { $ref: '#/components/schemas/SeasonMemberSummary' },
          removalReason: { type: string, nullable: true },
        }
    EnrollmentCreate:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        {
          userId: { type: string },
          role: { $ref: '#/components/schemas/SeasonRole' },
        }
    StudentLevelUpdate:
      type: object
      additionalProperties: false
      required: [studentLevel]
      properties:
        studentLevel:
          type: string
          description: The advanced value is displayed as Advance.
          enum: [novice, beginner, intermediate, advanced]
    EnrollmentUpdate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        {
          role: { type: string, enum: [student, mentor] },
          studentLevel:
            {
              type: string,
              enum: [novice, beginner, intermediate, advanced, not_applicable],
            },
        }
    EnrollmentPage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/Enrollment' },
                    },
                },
            },
          ],
      }
    Promotion:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        {
          role: { type: string, enum: [mentor, coordinator] },
          reason: { type: string },
        }
    Mentorship:
      type: object
      required: [id, seasonId, mentorUserId, studentUserId]
      properties:
        {
          createdAt: { type: string, format: date-time },
          endedAt: { type: string, format: date-time, nullable: true },
          id: { type: string },
          seasonId: { type: string },
          mentorUserId: { type: string },
          studentUserId: { type: string },
        }
    MentorshipCreate:
      type: object
      additionalProperties: false
      required: [mentorUserId, studentUserId]
      properties:
        { mentorUserId: { type: string }, studentUserId: { type: string } }
    MentorshipUpdate:
      type: object
      additionalProperties: false
      required: [mentorUserId, studentUserId]
      properties:
        { mentorUserId: { type: string }, studentUserId: { type: string } }
    MentorshipPage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/Mentorship' },
                    },
                },
            },
          ],
      }
    LeetcodeProblem:
      type: object
      required: [id, number, title, link, difficulty, categories, premium]
      properties:
        {
          id: { type: string },
          number: { type: integer },
          title: { type: string },
          link: { type: string, format: uri },
          difficulty: { $ref: '#/components/schemas/Difficulty' },
          categories: { type: array, items: { type: string } },
          premium: { type: boolean },
        }
    ProblemPage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/LeetcodeProblem' },
                    },
                },
            },
          ],
      }
    Attempt:
      description: Season and week are calculated from attemptedAt and the student participation history using current season dates.
      type: object
      required: [id, problemId, outcome, minutes, notes, attemptedAt]
      properties:
        {
          id: { type: string },
          problemId: { type: string },
          outcome: { $ref: '#/components/schemas/AttemptOutcome' },
          confidence: { type: integer, minimum: 1, maximum: 5, nullable: true },
          minutes: { type: integer, minimum: 1 },
          notes: { type: string },
          attemptedAt: { type: string, format: date-time },
          seasonId: { type: string, nullable: true },
          weekId: { type: string, nullable: true },
        }
    AttemptMutation:
      type: object
      additionalProperties: false
      required: [problemId, outcome, minutes, attemptedAt]
      properties:
        {
          problemId: { type: string },
          outcome: { $ref: '#/components/schemas/AttemptMutationOutcome' },
          confidence: { type: integer, minimum: 1, maximum: 5, nullable: true },
          minutes: { type: integer, minimum: 1 },
          notes: { type: string, maxLength: 10000 },
          attemptedAt: { type: string, format: date-time },
        }
    AttemptUpdate:
      allOf:
        - $ref: '#/components/schemas/AttemptMutation'
        - type: object
    AttemptPage:
      {
        allOf:
          [
            { $ref: '#/components/schemas/PageEnvelope' },
            {
              type: object,
              required: [items],
              properties:
                {
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/Attempt' },
                    },
                },
            },
          ],
      }
    Scores:
      type: object
      properties:
        {
          behavioural: { type: integer, minimum: 0, maximum: 10 },
          confirmQuestions: { type: integer, minimum: 0, maximum: 10 },
          algorithmDesign: { type: integer, minimum: 0, maximum: 10 },
          complexityAnalysis: { type: integer, minimum: 0, maximum: 10 },
          coding: { type: integer, minimum: 0, maximum: 10 },
          testing: { type: integer, minimum: 0, maximum: 10 },
          custom: { type: integer, minimum: 0, maximum: 10 },
        }
    MockRound:
      type: object
      required: [id, type, scores, reviewed, intervieweeComment]
      properties:
