name: rsp-website

x-postgres-image: &postgres-image postgres:18.6-alpine3.24

x-app-database: &app-database
  DATABASE_URL: postgresql://rsp_app:${APP_DB_PASSWORD:-rsp-local-app-database-password}@postgres:5432/${POSTGRES_DB:-rsp}?sslmode=disable&options=-c%20search_path%3Dapp

x-auth-database: &auth-database
  DATABASE_URL: postgresql://rsp_auth:${AUTH_DB_PASSWORD:-rsp-local-auth-database-password}@postgres:5432/${POSTGRES_DB:-rsp}?sslmode=disable&options=-c%20search_path%3Dauth

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rsp}
      POSTGRES_USER: ${POSTGRES_USER:-rsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsp-local-database-password}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  provision-db:
    image: *postgres-image
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-rsp}
      PGUSER: ${POSTGRES_USER:-rsp}
      PGPASSWORD: ${POSTGRES_PASSWORD:-rsp-local-database-password}
    volumes:
      - ./deploy/postgres/provision-roles.sql:/provision.sql:ro
    entrypoint: [psql]
    command:
      - --set
      - ON_ERROR_STOP=1
      - --set
      - migration_password=${MIGRATION_DB_PASSWORD:-rsp-local-migration-database-password}
      - --set
      - app_password=${APP_DB_PASSWORD:-rsp-local-app-database-password}
      - --set
      - auth_password=${AUTH_DB_PASSWORD:-rsp-local-auth-database-password}
      - --file
      - /provision.sql
    depends_on:
      postgres:
        condition: service_healthy

  migrate-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrations
    environment:
      GOOSE_DBSTRING: postgresql://rsp_migration:${MIGRATION_DB_PASSWORD:-rsp-local-migration-database-password}@postgres:5432/${POSTGRES_DB:-rsp}?sslmode=disable
    command: [up]
    depends_on:
      provision-db:
        condition: service_completed_successfully

  migrate-auth:
    image: *postgres-image
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-rsp}
      PGUSER: rsp_auth
      PGPASSWORD: ${AUTH_DB_PASSWORD:-rsp-local-auth-database-password}
    volumes:
      - ./deploy/postgres/migrate-auth.sql:/migrate-auth.sql:ro
      - ./apps/auth/migrations:/apps/auth/migrations:ro
    entrypoint: [psql]
    command: [--set, ON_ERROR_STOP=1, --file, /migrate-auth.sql]
    depends_on:
      provision-db:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: backend/dev.Dockerfile
    environment:
      <<: *app-database
      APP_ENV: development
      API_ADDR: :8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CURSOR_SECRET: ${CURSOR_SECRET:-rsp-local-cursor-hmac-secret-change-me}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-rsp-api}
      AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
      AUTH_INTERNAL_URL: http://auth:3001
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:-rsp-local-identity-service-token-change-me}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
    volumes:
      - ./backend:/workspace/backend
      - ./api:/workspace/api
      - ./db:/workspace/db
      - ./deploy/dev:/workspace/deploy/dev:ro
    depends_on:
      migrate-app:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          wget,
          -q,
          -O,
          /dev/null,
          http://127.0.0.1:8080/api/v2/health/ready,
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: backend/dev.Dockerfile
    command: [air, -c, deploy/dev/air-worker.toml]
    environment:
      <<: *app-database
      APP_ENV: development
    volumes:
      - ./backend:/workspace/backend
      - ./db:/workspace/db
      - ./deploy/dev:/workspace/deploy/dev:ro
    depends_on:
      migrate-app:
        condition: service_completed_successfully

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: development
    environment:
      <<: *auth-database
      NODE_ENV: development
      AUTH_HOST: 0.0.0.0
      AUTH_PORT: 3001
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-rsp-local-auth-secret-change-before-production}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:8080}
      AUTH_COOKIE_SECURE: 'false'
      AUTH_TRUST_PROXY_HEADERS: 'true'
      RSP_API_AUDIENCE: ${AUTH_AUDIENCE:-rsp-api}
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: ${EMAIL_FROM:-RSP <no-reply@rsp.local>}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      IDENTITY_SERVICE_URL: http://api:8080
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:-rsp-local-identity-service-token-change-me}
    volumes:
      - ./apps/auth/src:/workspace/apps/auth/src
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      VITE_USE_DEMO_DATA: ${VITE_USE_DEMO_DATA:-false}
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/public:/workspace/apps/web/public
      - ./api/openapi.yaml:/workspace/api/openapi.yaml:ro
    depends_on:
      auth:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - ${RSP_PORT:-8080}:8080
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/live]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    volumes:
      - mailpit-data:/data

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-rsp-local-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres-data:
  mailpit-data:
  prometheus-data:
  grafana-data:
