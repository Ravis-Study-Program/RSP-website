name: rsp-website

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true

x-app-database: &app-database
  DATABASE_URL: 'postgresql://rsp_app:${APP_DB_PASSWORD:-rsp-local-app-database-password}@postgres:5432/${POSTGRES_DB:-rsp}?sslmode=disable&options=-c%20search_path%3Dapp'

x-auth-database: &auth-database
  DATABASE_URL: 'postgresql://rsp_auth:${AUTH_DB_PASSWORD:-rsp-local-auth-database-password}@postgres:5432/${POSTGRES_DB:-rsp}?sslmode=disable&options=-c%20search_path%3Dauth'

x-api-environment: &api-environment
  <<: *app-database
  API_ADDR: ':8080'
  PUBLIC_ORIGIN: '${PUBLIC_ORIGIN:-http://localhost:8080}'
  CURSOR_SECRET: '${CURSOR_SECRET:-rsp-local-cursor-hmac-secret-change-me}'
  AUTH_ISSUER: '${AUTH_ISSUER:-http://localhost:8080}'
  AUTH_AUDIENCE: '${AUTH_AUDIENCE:-rsp-api}'
  AUTH_JWKS_URL: '${AUTH_JWKS_URL:-http://auth:3001/api/auth/jwks}'
  AUTH_INTERNAL_URL: 'http://auth:3001'
  IDENTITY_SERVICE_TOKEN: '${IDENTITY_SERVICE_TOKEN:-rsp-local-identity-service-token-change-me}'

x-auth-environment: &auth-environment
  <<: *auth-database
  AUTH_HOST: '0.0.0.0'
  AUTH_PORT: '3001'
  BETTER_AUTH_URL: '${PUBLIC_ORIGIN:-http://localhost:8080}'
  BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET:-rsp-local-auth-secret-change-before-production}'
  AUTH_TRUSTED_ORIGINS: '${AUTH_TRUSTED_ORIGINS:-http://localhost:8080,http://localhost:5173}'
  AUTH_COOKIE_SECURE: '${AUTH_COOKIE_SECURE:-false}'
  AUTH_TRUST_PROXY_HEADERS: '${AUTH_TRUST_PROXY_HEADERS:-true}'
  AUTH_IP_ADDRESS_HEADER: '${AUTH_IP_ADDRESS_HEADER:-x-real-ip}'
  AUTH_MFA_MAX_AGE_SECONDS: '${AUTH_MFA_MAX_AGE_SECONDS:-300}'
  RSP_API_AUDIENCE: '${AUTH_AUDIENCE:-rsp-api}'
  GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:-}'
  GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET:-}'
  EMAIL_PROVIDER: '${EMAIL_PROVIDER:-smtp}'
  EMAIL_FROM: '${EMAIL_FROM:-RSP <no-reply@rsp.local>}'
  SMTP_HOST: '${SMTP_HOST:-mailpit}'
  SMTP_PORT: '${SMTP_PORT:-1025}'
  SMTP_SECURE: '${SMTP_SECURE:-false}'
  AWS_REGION: '${AWS_REGION:-ap-southeast-2}'
  AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-}'
  AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-}'
  AWS_SESSION_TOKEN: '${AWS_SESSION_TOKEN:-}'
  IDENTITY_SERVICE_URL: 'http://api:8080'
  IDENTITY_SERVICE_TOKEN: '${IDENTITY_SERVICE_TOKEN:-rsp-local-identity-service-token-change-me}'
  IDENTITY_CALLBACK_TIMEOUT_MS: '3000'

services:
  postgres:
    <<: *common-security
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-rsp}'
      POSTGRES_USER: '${POSTGRES_USER:-rsp}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-rsp-local-database-password}'
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - data

  provision-db:
    <<: *common-security
    image: postgres:17.11-alpine3.24
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: '${POSTGRES_DB:-rsp}'
      PGUSER: '${POSTGRES_USER:-rsp}'
      PGPASSWORD: '${POSTGRES_PASSWORD:-rsp-local-database-password}'
    volumes:
      - ./deploy/postgres/provision-roles.sql:/provision/provision-roles.sql:ro
    entrypoint: ['psql']
    command:
      - --set
      - ON_ERROR_STOP=1
      - --set
      - migration_password=${MIGRATION_DB_PASSWORD:-rsp-local-migration-database-password}
      - --set
      - app_password=${APP_DB_PASSWORD:-rsp-local-app-database-password}
      - --set
      - auth_password=${AUTH_DB_PASSWORD:-rsp-local-auth-database-password}
      - --file
      - /provision/provision-roles.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - data

  migrate-app:
    <<: *common-security
    profiles: ['dev', 'prod']
    image: rsp-migrations:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrations
    environment:
      GOOSE_DBSTRING: 'postgresql://rsp_migration:${MIGRATION_DB_PASSWORD:-rsp-local-migration-database-password}@postgres:5432/${POSTGRES_DB:-rsp}?sslmode=disable'
    command: ['up']
    depends_on:
      provision-db:
        condition: service_completed_successfully
    restart: 'no'
    networks:
      - data

  migrate-auth:
    <<: *common-security
    profiles: ['dev', 'prod']
    image: postgres:17.11-alpine3.24
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: '${POSTGRES_DB:-rsp}'
      PGUSER: rsp_auth
      PGPASSWORD: '${AUTH_DB_PASSWORD:-rsp-local-auth-database-password}'
    volumes:
      - ./deploy/postgres/migrate-auth.sql:/migrations/migrate-auth.sql:ro
      - ./apps/auth/migrations/better-auth.sql:/apps/auth/migrations/better-auth.sql:ro
      - ./apps/auth/migrations/0002-lifecycle-outbox.sql:/apps/auth/migrations/0002-lifecycle-outbox.sql:ro
    entrypoint: ['psql']
    command:
      ['--set', 'ON_ERROR_STOP=1', '--file', '/migrations/migrate-auth.sql']
    depends_on:
      provision-db:
        condition: service_completed_successfully
    restart: 'no'
    networks:
      - data

  api-dev:
    <<: *common-security
    profiles: ['dev']
    image: rsp-api-dev:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/dev.Dockerfile
    environment:
      <<: *api-environment
      APP_ENV: development
      DEV_AUTH_BYPASS: '${DEV_AUTH_BYPASS:-false}'
    volumes:
      - ./backend:/workspace/backend
      - ./api:/workspace/api
      - ./db:/workspace/db
      - ./deploy/dev:/workspace/deploy/dev:ro
      - api-go-mod-cache:/go/pkg/mod
      - api-go-build-cache:/home/rsp/.cache/go-build
    depends_on:
      migrate-app:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8080/api/v2/health/live',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      app:
        aliases: ['api']
      data: {}

  worker-dev:
    <<: *common-security
    profiles: ['dev']
    image: rsp-worker-dev:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/dev.Dockerfile
    command: ['air', '-c', 'deploy/dev/air-worker.toml']
    environment:
      <<: *app-database
      APP_ENV: development
      TZ: UTC
    volumes:
      - ./backend:/workspace/backend
      - ./db:/workspace/db
      - ./deploy/dev:/workspace/deploy/dev:ro
      - worker-go-mod-cache:/go/pkg/mod
      - worker-go-build-cache:/home/rsp/.cache/go-build
    depends_on:
      migrate-app:
        condition: service_completed_successfully
    networks:
      - app
      - data

  auth-dev:
    <<: *common-security
    profiles: ['dev']
    image: rsp-auth-dev:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: development
    environment:
      <<: *auth-environment
      NODE_ENV: development
    volumes:
      - ./apps/auth/src:/workspace/apps/auth/src
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      api-dev:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      app:
        aliases: ['auth']
      data: {}

  web-dev:
    <<: *common-security
    profiles: ['dev']
    image: rsp-web-dev:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      VITE_USE_DEMO_DATA: '${VITE_USE_DEMO_DATA:-false}'
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/public:/workspace/apps/web/public
      - ./api/openapi.yaml:/workspace/api/openapi.yaml:ro
    depends_on:
      api-dev:
        condition: service_healthy
      auth-dev:
        condition: service_healthy
    networks:
      app:
        aliases: ['web']

  nginx-dev:
    <<: *common-security
    profiles: ['dev']
    image: nginxinc/nginx-unprivileged:1.31.3-alpine3.24
    ports:
      - '${RSP_PORT:-8080}:8080'
    volumes:
      - ./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy-common.conf:/etc/nginx/includes/proxy-common.conf:ro
    tmpfs:
      - /tmp
    depends_on:
      web-dev:
        condition: service_started
      api-dev:
        condition: service_healthy
      auth-dev:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8080/health/live',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  api:
    <<: *common-security
    profiles: ['prod']
    image: rsp-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
      args:
        BINARY: api
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *api-environment
      APP_ENV: production
    depends_on:
      migrate-app:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8080/api/v2/health/ready',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - app
      - data

  worker:
    <<: *common-security
    profiles: ['prod']
    image: rsp-worker:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
      args:
        BINARY: worker
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *app-database
      APP_ENV: production
      LEETCODE_SYNC_URL: '${LEETCODE_SYNC_URL:-https://leetcode.com/graphql/}'
      TZ: UTC
    depends_on:
      migrate-app:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app
      - data

  auth:
    <<: *common-security
    profiles: ['prod']
    image: rsp-auth:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: runtime
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *auth-environment
      NODE_ENV: production
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - app
      - data

  web:
    <<: *common-security
    profiles: ['prod']
    image: rsp-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  nginx:
    <<: *common-security
    profiles: ['prod']
    image: nginxinc/nginx-unprivileged:1.31.3-alpine3.24
    read_only: true
    ports:
      # The production HTTP hop is consumed only by a trusted host-local TLS
      # terminator. Never publish this clear-text origin on a public interface.
      - '127.0.0.1:${RSP_PORT:-8080}:8080'
    volumes:
      - ./deploy/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy-common-prod.conf:/etc/nginx/includes/proxy-common.conf:ro
    tmpfs:
      - /tmp
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8080/health/live',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - app

  mailpit:
    <<: *common-security
    profiles: ['dev']
    image: axllent/mailpit:v1.30.7
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    volumes:
      - mailpit-data:/data
    restart: unless-stopped
    networks:
      - app

  prometheus:
    <<: *common-security
    profiles: ['dev', 'prod']
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - app

  grafana:
    <<: *common-security
    profiles: ['dev', 'prod']
    image: grafana/grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:-rsp-local-grafana-password}'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SERVER_ROOT_URL: 'http://localhost:${GRAFANA_PORT:-3000}'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    internal: false
  data:
    internal: true

volumes:
  postgres-data:
  mailpit-data:
  prometheus-data:
  grafana-data:
  api-go-mod-cache:
  api-go-build-cache:
  worker-go-mod-cache:
  worker-go-build-cache:
