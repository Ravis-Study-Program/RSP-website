name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: 1.26.9
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 10.15.0

jobs:
  quality-and-codegen:
    name: Format, lint, types and generated code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Go formatting
        run: scripts/ci/check-gofmt.sh
      - name: Vet Go
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
      - name: Check authored formatting
        run: pnpm format:check
      - name: Lint TypeScript, React and Node scripts
        run: pnpm lint
      - name: TypeScript checks
        run: pnpm -r check
      - name: Regenerate API clients
        run: |
          pnpm --filter @rsp/web generate
          git diff --exit-code -- \
            apps/web/src/api/generated
      - name: Check module metadata drift
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Validate Compose
        run: docker compose config --quiet

  impeccable:
    name: Impeccable design detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Uses the project-scoped skill launcher (pinned by skills-lock.json); it
      # downloads its self-contained binary on first run. Exit 2 = primary
      # findings, 1 = scan failure; advisory findings never fail the job.
      - name: Scan web UI against DESIGN.md
        working-directory: apps/web
        run: ../../.agents/skills/impeccable/scripts/impeccable detect src

  unit:
    name: Unit and race tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Go tests with race detector
        run: go test -race -coverprofile=go-coverage.out ./...
      - name: TypeScript tests
        run: pnpm test
      - name: Production builds
        run: pnpm build

  postgres-integration:
    name: PostgreSQL 18 migrations and integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: rsp
          POSTGRES_USER: rsp
          POSTGRES_PASSWORD: rsp-ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsp -d rsp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.30.7
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://rsp:rsp-ci-database-password@127.0.0.1:5432/rsp?sslmode=disable
      TEST_DATABASE_URL: postgresql://rsp:rsp-ci-database-password@127.0.0.1:5432/rsp?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client and Goose
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.3
      - name: Migrate app and auth schemas
        run: scripts/ci/postgres.sh migrate
      - name: Prove existing auth schema upgrades and remains idempotent
        env:
          PGPASSWORD: rsp-ci-database-password
        run: scripts/ci/postgres.sh prove-auth-upgrade
      - name: Prove concurrent auth migration runners serialize the full sequence
        env:
          PGPASSWORD: rsp-ci-database-password
        run: scripts/ci/postgres.sh prove-auth-concurrent
      - name: Run PostgreSQL-backed tests
        run: go test -tags=integration ./...
      - name: Run live Better Auth session, MFA, linking and JWKS tests
        env:
          AUTH_LIVE_TEST: 'true'
          AUTH_LIVE_MAILPIT_URL: http://127.0.0.1:8025
          DATABASE_URL: postgresql://rsp:rsp-ci-database-password@127.0.0.1:5432/rsp?sslmode=disable&options=-c%20search_path%3Dauth
          NODE_ENV: test
          AUTH_HOST: 127.0.0.1
          AUTH_PORT: '3001'
          BETTER_AUTH_URL: http://127.0.0.1:3001
          BETTER_AUTH_SECRET: rsp-ci-live-auth-secret-000000000000
          AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3001
          AUTH_COOKIE_SECURE: 'false'
          AUTH_TRUST_PROXY_HEADERS: 'false'
          IDENTITY_SERVICE_URL: http://127.0.0.1:4000
          IDENTITY_SERVICE_TOKEN: rsp-ci-live-identity-token-0000000000
          EMAIL_PROVIDER: smtp
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_SECURE: 'false'
        run: pnpm --filter @rsp/auth exec vitest run test/live-auth-handler.test.ts
      - name: Prove app migration down and up
        run: scripts/ci/postgres.sh prove-app-roundtrip

  browser-e2e:
    name: Browser and accessibility workflows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @rsp/web exec playwright install --with-deps chromium firefox webkit
      - name: Run desktop/mobile E2E, compatibility and axe checks
        run: pnpm --filter @rsp/web e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  real-stack-browser-e2e:
    name: Real auth, API and PostgreSQL browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: rsp-real-e2e
      APP_ENV: test
      RSP_E2E_ALLOW_MUTATION: 'true'
      REAL_E2E_HTTP_PORT: 18080
      POSTGRES_PORT: 15432
      MAILPIT_SMTP_PORT: 11025
      MAILPIT_UI_PORT: 18025
      PROMETHEUS_PORT: 19090
      GRAFANA_PORT: 13000
      PUBLIC_ORIGIN: http://127.0.0.1:18080
      AUTH_ISSUER: http://127.0.0.1:18080
      AUTH_TRUSTED_ORIGINS: http://127.0.0.1:18080
      POSTGRES_DB: rsp
      POSTGRES_USER: rsp
      POSTGRES_PASSWORD: rsp-real-e2e-postgres-password
      MIGRATION_DB_PASSWORD: rsp-real-e2e-migration-password
      APP_DB_PASSWORD: rsp-real-e2e-app-database-password
      AUTH_DB_PASSWORD: rsp-real-e2e-auth-database-password
      BETTER_AUTH_SECRET: rsp-real-e2e-better-auth-secret-000000
      IDENTITY_SERVICE_TOKEN: rsp-real-e2e-identity-service-token-000000
      CURSOR_SECRET: rsp-real-e2e-cursor-secret-0000000000000
      RSP_E2E_BASE_URL: http://127.0.0.1:18080
      RSP_E2E_MAILPIT_URL: http://127.0.0.1:18025
      RSP_E2E_STUDENT_EMAIL: e2e.student@example.test
      RSP_E2E_STUDENT_PASSWORD: RspRealE2eOnly-Student-2026
      RSP_E2E_COORDINATOR_EMAIL: e2e.coordinator@example.test
      RSP_E2E_COORDINATOR_PASSWORD: RspRealE2eOnly-Coordinator-2026
      RSP_E2E_DIRECTOR_EMAIL: e2e.director@example.test
      RSP_E2E_DIRECTOR_PASSWORD: RspRealE2eOnly-Director-2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @rsp/web exec playwright install --with-deps chromium
      - name: Start isolated development stack
        run: scripts/ci/real-e2e-stack.sh up
      - name: Run 10 live Better Auth and PostgreSQL tests in isolation
        run: scripts/ci/real-e2e-stack.sh auth-live-tests
      - name: Provision verified role fixtures
        env:
          APP_ENV: test
          RSP_E2E_ALLOW_DATABASE_WRITE: 'true'
          RSP_E2E_OUTPUT_ENV: ${{ runner.temp }}/rsp-real-e2e.env
        run: |
          node deploy/scripts/provision-real-e2e.mjs
          cat "$RSP_E2E_OUTPUT_ENV" >> "$GITHUB_ENV"
      - name: Run real-stack role workflows
        run: pnpm --filter @rsp/web e2e:real
      - name: Upload real-stack failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-real-stack-results
          path: |
            apps/web/test-results-real
            apps/web/playwright-report-real
          if-no-files-found: ignore
          retention-days: 7
      - name: Real-stack logs on failure
        if: failure()
        run: scripts/ci/real-e2e-stack.sh diagnostics
      - name: Stop isolated development stack
        if: always()
        run: scripts/ci/real-e2e-stack.sh down

  dependency-security:
    name: Dependency and secret security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Go vulnerability database
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: pnpm audit
        run: pnpm audit --audit-level high
      # Pinned gitleaks CLI; see the script for why not the GitHub Action.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: scripts/ci/gitleaks.sh

  migration-fixture:
    name: Legacy migration rehearsal fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Plan Auth0 identities and exercise legacy migration fixtures
        run: scripts/ci/legacy-migration-fixture.sh

  containers:
    name: Production images and Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE_TAG: ci
      PUBLIC_ORIGIN: https://rsp.invalid
      RSP_PORT: 8080
      POSTGRES_DB: rsp
      POSTGRES_USER: rsp
      POSTGRES_PASSWORD: ci-only-fixture-pg-000000
      MIGRATION_DB_PASSWORD: ci-only-fixture-migration-000000
      APP_DB_PASSWORD: ci-only-fixture-app-000000
      AUTH_DB_PASSWORD: ci-only-fixture-auth-000000
      BETTER_AUTH_SECRET: ci-only-fixture-better-auth-0000000000
      IDENTITY_SERVICE_TOKEN: ci-only-fixture-identity-000000000000
      CURSOR_SECRET: ci-only-fixture-cursor-00000000000000
      AUTH_ISSUER: https://rsp.invalid
      AUTH_AUDIENCE: rsp-api
      AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
      AUTH_TRUSTED_ORIGINS: https://rsp.invalid
      AUTH_COOKIE_SECURE: 'true'
      AUTH_TRUST_PROXY_HEADERS: 'true'
      AUTH_IP_ADDRESS_HEADER: x-real-ip
      GOOGLE_CLIENT_ID: rsp-ci-google-client
      GOOGLE_CLIENT_SECRET: rsp-ci-google-secret
      EMAIL_PROVIDER: ses
      EMAIL_FROM: RSP <no-reply@rsp.invalid>
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production images
        run: scripts/ci/containers.sh build
      - name: Prove production web bundle excludes demo fixtures
        run: scripts/ci/containers.sh check-web-bundle
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rsp-api:ci
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan auth image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rsp-auth:ci
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rsp-worker:ci
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rsp-web:ci
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan migration image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rsp-migrations:ci
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan operations image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rsp-ops:ci
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
