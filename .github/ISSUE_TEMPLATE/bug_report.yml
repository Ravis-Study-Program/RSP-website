name: Bug Report
description: Report a problem with the website or its services.
type: bug
labels: ['bug']

body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search the existing issues for duplicates.

        Do not include passwords, tokens, personal data, or production records.
        Do not report security vulnerabilities in a public issue; contact the
        maintainers privately instead.

  - type: checkboxes
    attributes:
      label: Duplicate check
      options:
        - label: I have searched the existing issues and found no duplicate.
          required: true

  - type: textarea
    id: observed-behaviour
    attributes:
      label: Observed behaviour
      description: What happened? Include the exact error message when possible.
      placeholder: Tell us what you saw.
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: A clear and concise description of what you expected to happen.
      placeholder: Tell us what should have happened.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: |
        List the smallest set of steps that reproduces the problem. If the
        problem is intermittent or you cannot reproduce it again, say so and
        describe what you tried.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: affected-area
    attributes:
      label: Affected page, feature, or service
      description: Name the route, feature, API, worker, or other affected area.
      placeholder: For example, Student dashboard or POST /api/v2/...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local development
        - Other or unknown
    validations:
      required: true

  - type: textarea
    id: environment-details
    attributes:
      label: Environment details
      description: Include the OS, browser, and browser version when relevant.
      value: |
        - **OS**:
        - **Browser and version**:
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Logs, screenshots, and additional context
      description: |
        Attach screenshots or recordings and paste relevant logs or request
        IDs. Redact secrets, tokens, personal data, and production records.
    validations:
      required: false
